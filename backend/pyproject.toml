[project]
name = "openwhisper-backend"
version = "0.1.0"
description = "OpenWhisper Backend — self-hosted STT + AI post-processing server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "faster-whisper>=1.1",
    "python-multipart>=0.0.12",
    "numpy>=1.24",
    "soundfile>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.4"]
dev = ["pytest>=8.0", "ruff>=0.8", "pytest-asyncio>=0.24"]

[project.scripts]
openwhisper-server = "app.main:run"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
